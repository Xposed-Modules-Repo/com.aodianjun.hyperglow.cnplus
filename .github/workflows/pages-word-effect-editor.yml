name: Deploy Word Effect Studio to GitHub Pages

# The editor is a static site (index.html + engine.js + templates.js + app.js).
# There is no build step: this workflow only stages those four files into _site
# and lets GitHub Pages serve the editor at the repository root.
#
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'tools/word-effect-editor/**'
      - '.github/workflows/pages-word-effect-editor.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-word-effect-editor
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stage static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp tools/word-effect-editor/index.html \
             tools/word-effect-editor/engine.js \
             tools/word-effect-editor/templates.js \
             tools/word-effect-editor/app.js \
             _site/
          ls -l _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
